<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MinuteFlow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1318">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MinuteFlow 議事録</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1318;--card:#1e2633;--card2:#232d3d;--border:#2a3748;
  --accent:#6366f1;--accent2:#818cf8;--muted:#6a7d96;--text:#e8edf4;
  --tag:#263347;--danger:#e05040;--success:#38b878;--orange:#ea580c;--green:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;}

/* TOP NAV */
#topNav{flex-shrink:0;z-index:200;background:rgba(15,19,24,.97);
  border-bottom:1px solid var(--border);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:8px;}
.nav-hex{width:26px;height:26px;background:var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900;}
.nav-title{font-family:monospace;font-size:17px;letter-spacing:2px;font-weight:700;}
.nav-badge{background:var(--accent);color:#fff;font-weight:700;font-size:11px;border-radius:20px;padding:2px 8px;}

/* SCREEN CONTAINER */
#screenWrap{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* BOTTOM NAV */
#bottomNav{flex-shrink:0;z-index:200;
  background:rgba(15,19,24,.97);border-top:1px solid var(--border);display:flex;}
.nav-tab{flex:1;padding:9px 2px;display:flex;flex-direction:column;align-items:center;
  gap:2px;cursor:pointer;border:none;background:transparent;color:var(--muted);
  transition:color .1s;border-radius:8px;}
.nav-tab.active{color:var(--accent);}
.nav-tab:active{background:var(--card2);transform:scale(0.94);}
.nav-tab-icon{font-size:18px;}
.nav-tab-label{font-size:9px;}

/* FAB */
#fab{position:fixed;bottom:74px;right:16px;z-index:150;width:52px;height:52px;
  border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;
  cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s;}
#fab:active{transform:scale(0.88);}

/* CARDS */
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.sec-hdr{background:var(--card2);padding:9px 14px;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0;}
.meta-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px;}
.meta-row:last-child{border-bottom:none;}
.meta-icon{font-size:14px;min-width:20px;text-align:center;}
.meta-key{font-size:11px;color:var(--muted);min-width:68px;}
.meta-val{flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:500;outline:none;}
.meta-val::placeholder{color:var(--border);}
.fta{width:100%;background:transparent;border:none;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:13px;line-height:1.8;
  padding:10px 14px;resize:none;outline:none;min-height:72px;}
.fta::placeholder{color:var(--border);}

/* MEETING LIST */
.m-item{background:var(--card);border-radius:14px;border:1px solid var(--border);
  padding:12px 14px;cursor:pointer;transition:border-color .15s;}
.m-item:active{border-color:var(--accent);}
.m-title{font-size:14px;font-weight:700;}
.m-title.empty{color:var(--muted);font-style:italic;}
.m-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.m-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.m-tag{font-size:10px;border-radius:6px;padding:2px 8px;font-weight:700;}
.status-badge{font-size:10px;border-radius:8px;padding:2px 8px;font-weight:700;}

/* DETAIL HEADER */
#detailHdr{flex-shrink:0;background:rgba(15,19,24,.97);
  border-bottom:1px solid var(--border);padding:10px 14px;
  display:flex;align-items:center;gap:8px;}
.back-btn{width:34px;height:34px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .1s;}
.back-btn:active{transform:scale(0.9);}
#dTitle{flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;outline:none;}
#dTitle::placeholder{color:var(--muted);}
.del-btn{width:32px;height:32px;background:transparent;border:1px solid var(--border);
  border-radius:10px;color:var(--muted);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .1s;}
.del-btn:active{background:var(--danger);color:#fff;border-color:var(--danger);}

/* STATUS BUTTONS */
.st-bar{flex-shrink:0;display:flex;gap:6px;padding:8px 14px;
  background:var(--card2);border-bottom:1px solid var(--border);}
.st-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all .1s;}
.st-btn:active{transform:scale(0.92);}
.st-btn.active-draft{border-color:#94a3b8;background:rgba(148,163,184,.15);color:#94a3b8;}
.st-btn.active-inprogress{border-color:#3b82f6;background:rgba(59,130,246,.15);color:#60a5fa;}
.st-btn.active-done{border-color:var(--success);background:rgba(22,163,74,.15);color:#4ade80;}

/* AGENDA BLOCK — 議題+決定+アクション+画像の1セット */
.agenda-block{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.agenda-block-hdr{background:var(--card2);padding:10px 14px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.agenda-num{font-family:monospace;font-size:16px;color:var(--accent);font-weight:700;min-width:24px;}
.agenda-input{flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;outline:none;}
.agenda-input::placeholder{color:var(--muted);}
.agenda-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;}
.agenda-del:active{color:var(--danger);}

/* sub section label inside block */
.sub-sec{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px 4px;border-top:1px solid var(--border);}
.sub-sec-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.sub-sec-add{font-size:11px;font-weight:700;padding:3px 10px;border:none;border-radius:6px;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;color:#fff;}

/* list items inside block */
.list-item{display:flex;align-items:center;padding:8px 14px;border-top:1px solid var(--border);gap:8px;}
.list-num{font-family:monospace;font-size:12px;color:var(--accent);font-weight:700;min-width:16px;}
.list-input{flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none;}
.list-input::placeholder{color:var(--border);}
.item-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;}
.item-del:active{color:var(--danger);}

/* action items */
.action-item{border-top:1px solid var(--border);padding:8px 14px;}
.action-top{display:flex;align-items:center;gap:8px;}
.action-cb{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.action-sub{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px 0 0 23px;}
.sub-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.sub-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:6px;
  padding:5px 8px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:11px;outline:none;}
.sub-input::placeholder{color:var(--muted);}

/* images inside block */
.img-grid{display:grid;gap:6px;padding:10px;}
.img-grid.sm{grid-template-columns:repeat(4,1fr);}
.img-grid.md{grid-template-columns:repeat(3,1fr);}
.img-grid.lg{grid-template-columns:repeat(2,1fr);}
.img-wrap{position:relative;border-radius:8px;overflow:hidden;background:var(--tag);aspect-ratio:1;}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.img-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;
  border-radius:50%;width:22px;height:22px;color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.add-photo{border-radius:8px;border:2px dashed var(--border);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--muted);font-size:11px;cursor:pointer;aspect-ratio:1;}
.add-photo input{display:none;}
.paste-zone{margin:0 10px 0;border:2px dashed var(--border);border-radius:10px;
  padding:10px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;}
.paste-zone.over{border-color:var(--accent);background:rgba(99,102,241,.08);color:var(--accent);}

/* size buttons */
.size-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:10px;cursor:pointer;}
.size-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

/* NOTES in block */
.block-notes{padding:8px 14px;border-top:1px solid var(--border);}

/* AI panel */
.ai-panel{background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:14px;
  border:1px solid #4f46e5;padding:14px;}
.ai-mode-btn{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;
  font-weight:700;background:rgba(255,255,255,.1);color:#c7d2fe;transition:all .15s;
  font-family:'Noto Sans JP',sans-serif;}
.ai-mode-btn.active{background:#6366f1;color:#fff;}

/* BIG BUTTONS */
.big-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);
  color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s,opacity .1s;}
.big-btn:active{transform:scale(0.96);opacity:.8;}
.big-btn.green{background:var(--success);}
.big-btn.gray{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.big-btn.complete{background:linear-gradient(135deg,#4338ca,#6366f1);
  box-shadow:0 4px 18px rgba(99,102,241,.35);}

/* ARCHIVE */
.rep-item{background:var(--card);border-radius:14px;border:1px solid var(--border);
  padding:14px;border-left:4px solid var(--accent);}

/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:44px;margin-bottom:12px;}
.empty-text{font-size:13px;line-height:1.7;}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--success);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;
  font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CAMERA MODAL */
#camModal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;}
#camModal.show{display:flex;}

/* PRINT */
#printArea{display:none;}
@media print{
  html,body{
    height:auto!important;overflow:visible!important;
    display:block!important;background:#fff!important;
  }
  #screenWrap,#topNav,#bottomNav,#fab,#toast,#camModal{display:none!important;}
  #printArea{
    display:block!important;color:#1a2332;font-family:sans-serif;
    background:#fff;width:100%;
  }
}
</style>
</head>
<body>

<div id="topNav">
  <div class="nav-logo">
    <div class="nav-hex">M</div>
    <span class="nav-title">MinuteFlow</span>
  </div>
  <span class="nav-badge" id="badge">0件</span>
</div>

<div id="screenWrap">

<!-- ====== HOME ====== -->
<div class="screen active" id="sHome">
  <div class="screen-body" style="padding:12px 14px 100px;display:flex;flex-direction:column;gap:10px;">
    <!-- 検索・フィルタ -->
    <div style="display:flex;gap:6px;">
      <input id="searchInput" type="text" placeholder="🔍 会議名で検索…"
        style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:9px 12px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none;"
        oninput="renderList()">
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="m-tag" id="fAll" onclick="setFilter('')" style="cursor:pointer;border:none;padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(99,102,241,.2);color:var(--accent2);">すべて</button>
      <button class="m-tag" id="fDraft" onclick="setFilter('draft')" style="cursor:pointer;border:none;padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(148,163,184,.15);color:#94a3b8;">下書き</button>
      <button class="m-tag" id="fProg" onclick="setFilter('inprogress')" style="cursor:pointer;border:none;padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(59,130,246,.15);color:#60a5fa;">会議中</button>
      <button class="m-tag" id="fDone" onclick="setFilter('done')" style="cursor:pointer;border:none;padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(22,163,74,.15);color:#4ade80;">完了</button>
      <span style="font-size:11px;color:var(--muted);margin-left:auto;align-self:center;" id="listCount">0件</span>
    </div>
    <div id="mList" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button class="big-btn complete" onclick="addMeeting()" style="margin-top:4px;">＋ &nbsp;新しい議事録を作成</button>
  </div>
</div>

<!-- ====== DETAIL ====== -->
<div class="screen" id="sDetail">
  <div id="detailHdr">
    <button class="back-btn" onclick="goBack()">‹</button>
    <input id="dTitle" type="text" placeholder="会議名を入力…" oninput="save()">
    <button class="del-btn" onclick="deleteCurrent()">🗑</button>
  </div>
  <div class="st-bar">
    <button class="st-btn" id="stDraft" onclick="setStatus('draft')">下書き</button>
    <button class="st-btn" id="stInprogress" onclick="setStatus('inprogress')">会議中</button>
    <button class="st-btn" id="stDone" onclick="setStatus('done')">完了</button>
  </div>
  <!-- 1ページスクロール -->
  <div class="screen-body" id="detailBody" style="padding:12px 14px 100px;display:flex;flex-direction:column;gap:12px;">

    <!-- 基本情報 -->
    <div class="card">
      <div class="sec-hdr"><span class="dot"></span>基本情報</div>
      <div class="meta-row"><span class="meta-icon">📅</span><span class="meta-key">日時</span>
        <input class="meta-val" id="dDate" type="datetime-local" style="color-scheme:dark" onchange="save()"></div>
      <div class="meta-row"><span class="meta-icon">📍</span><span class="meta-key">場所</span>
        <input class="meta-val" id="dLocation" type="text" placeholder="会議室A / Zoom…" oninput="save()"></div>
      <div class="meta-row" style="border-bottom:none"><span class="meta-icon">👥</span><span class="meta-key">参加者</span>
        <input class="meta-val" id="dAttendees" type="text" placeholder="山田, 鈴木, 田中…" oninput="save();renderAttendees()"></div>
      <div id="attendeeTagsWrap" style="padding:4px 14px 10px;display:flex;flex-wrap:wrap;gap:5px;min-height:0;"></div>
    </div>

    <!-- 議題リスト（各議題が独立ブロック） -->
    <div id="agendaBlocks" style="display:flex;flex-direction:column;gap:12px;"></div>

    <!-- 議題追加ボタン -->
    <button onclick="addAgenda()" style="padding:12px;border-radius:12px;border:2px dashed var(--border);
      background:transparent;color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:13px;
      font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
      ＋ 議題を追加
    </button>

    <!-- メモ全体 -->
    <div class="card">
      <div class="sec-hdr"><span class="dot" style="background:#94a3b8"></span>全体メモ</div>
      <textarea class="fta" id="dNotes" placeholder="会議全体のメモ、補足情報…" rows="4" oninput="save()"></textarea>
    </div>

    <!-- AI -->
    <div class="ai-panel">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:16px;">✦</span>
        <span style="font-weight:800;font-size:14px;">AI アシスタント</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="ai-mode-btn active" id="mSummary" onclick="setAiMode('summary')">✦ 要約</button>
        <button class="ai-mode-btn" id="mActions" onclick="setAiMode('actions')">◈ アクション提案</button>
        <button class="ai-mode-btn" id="mFormat" onclick="setAiMode('format')">❐ 整形</button>
      </div>
      <button onclick="runAI()" id="aiRunBtn"
        style="width:100%;padding:10px;background:#818cf8;color:#fff;border:none;border-radius:10px;
        font-weight:800;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">
        ✦ 要約を生成
      </button>
      <div id="aiResult" style="display:none;margin-top:12px;background:rgba(255,255,255,.08);border-radius:10px;padding:12px;">
        <pre id="aiResultText" style="margin:0;font-size:12px;line-height:1.7;color:#e0e7ff;white-space:pre-wrap;font-family:inherit;"></pre>
        <button onclick="appendAiResult()" style="margin-top:8px;font-size:12px;font-weight:700;padding:6px 12px;
          background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">
          メモに追記
        </button>
      </div>
    </div>

    <!-- アーカイブ -->
    <button class="big-btn complete" onclick="archiveCurrent()">✅ &nbsp;この議事録をアーカイブに保存</button>
  </div>
</div>

<!-- ====== ARCHIVE ====== -->
<div class="screen" id="sArchive">
  <div class="screen-body" style="padding:14px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-family:monospace;font-size:13px;letter-spacing:3px;color:var(--muted);font-weight:700;">ARCHIVE</span>
      <span style="font-size:11px;color:var(--muted);" id="archiveCount">0件</span>
    </div>
    <!-- 全体バックアップ・復元 -->
    <div class="card" style="overflow:hidden;">
      <div class="sec-hdr"><span class="dot" style="background:#38b878"></span>全データ バックアップ・復元</div>
      <div style="padding:10px 14px;display:flex;gap:8px;">
        <button class="big-btn green" style="flex:1;padding:10px;font-size:12px;" onclick="doBackup()">💾 バックアップ</button>
        <label class="big-btn gray" style="flex:1;padding:10px;font-size:12px;cursor:pointer;justify-content:center;">
          📂 復元
          <input type="file" accept=".json" style="display:none;" onchange="doRestore(this)">
        </label>
      </div>
    </div>
    <div id="archiveList" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>
</div>



</div><!-- /screenWrap -->

<button id="fab" onclick="addMeeting()">＋</button>

<div id="bottomNav">
  <button class="nav-tab active" id="tHome" onclick="showScreen('home')"><span class="nav-tab-icon">📋</span><span class="nav-tab-label">議事録</span></button>
  <button class="nav-tab" id="tArchive" onclick="showScreen('archive')"><span class="nav-tab-icon">🗂</span><span class="nav-tab-label">アーカイブ</span></button>
</div>
<div id="toast"></div>
<div id="printArea"></div>

<!-- CAMERA MODAL -->
<div id="camModal">
  <div style="width:min(440px,94vw);background:#0f1318;border-radius:18px;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1e293b;">
      <span style="font-weight:800;color:#fff;font-size:14px;">📷 カメラ撮影</span>
      <div style="display:flex;gap:8px;">
        <button onclick="flipCamera()" style="font-size:12px;padding:5px 10px;background:rgba(255,255,255,.1);color:#cbd5e1;border:none;border-radius:8px;cursor:pointer;font-weight:700;">🔄</button>
        <button onclick="closeCam()" style="font-size:12px;padding:5px 10px;background:rgba(255,255,255,.1);color:#cbd5e1;border:none;border-radius:8px;cursor:pointer;font-weight:700;">✕</button>
      </div>
    </div>
    <video id="camVideo" autoplay playsinline muted style="width:100%;max-height:320px;background:#000;object-fit:cover;display:block;"></video>
    <div style="padding:14px;display:flex;justify-content:center;">
      <button id="camShoot" onclick="shootPhoto()"
        style="width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #64748b;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.2);"></button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
var meetings = [];
var archive  = [];
var currentId = null;
var imgSize   = 'sm';
var aiMode    = 'summary';
var filterStatus = '';
var camStream = null;
var camFacing = 'environment';
var camTargetAgendaId = null; // カメラ撮影対象の議題ID

// ===== INDEXEDDB =====
var db = null;
function openDB(cb){
  if(db){cb(db);return;}
  var req = indexedDB.open('minuteFlowDB2', 1);
  req.onupgradeneeded = function(e){
    var d = e.target.result;
    if(!d.objectStoreNames.contains('state')) d.createObjectStore('state');
  };
  req.onsuccess = function(e){db = e.target.result; cb(db);};
  req.onerror   = function(){toast('DB初期化エラー','var(--danger)');};
}
function saveDB(cb){
  openDB(function(d){
    var tx = d.transaction('state','readwrite');
    tx.objectStore('state').put({meetings:meetings, archive:archive}, 'main');
    tx.oncomplete = function(){if(cb)cb();};
    tx.onerror    = function(){toast('保存エラー','var(--danger)');};
  });
}
function loadDB(cb){
  openDB(function(d){
    var req = d.transaction('state','readonly').objectStore('state').get('main');
    req.onsuccess = function(e){cb(e.target.result||null);};
    req.onerror   = function(){cb(null);};
  });
}
function save(){if(currentId) saveDB();}

// ===== TOAST =====
function toast(msg, col){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = col||'var(--success)';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 2400);
}

// ===== SCREENS =====
function showScreen(name){
  ['sHome','sDetail','sArchive'].forEach(function(id){
    document.getElementById(id).classList.remove('active');
  });
  ['tHome','tArchive'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.classList.remove('active');
  });
  document.getElementById('fab').style.display = name==='home'?'flex':'none';
  var map  = {home:'sHome', archive:'sArchive'};
  var tmap = {home:'tHome', archive:'tArchive'};
  if(map[name])  document.getElementById(map[name]).classList.add('active');
  if(tmap[name]){var el=document.getElementById(tmap[name]);if(el)el.classList.add('active');}
  if(name==='home')    renderList();
  if(name==='archive') renderArchive();
}
function showDetail(){
  ['sHome','sArchive'].forEach(function(id){
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('sDetail').classList.add('active');
  document.getElementById('fab').style.display = 'none';
}

// ===== HELPERS =====
function getM(id){return meetings.find(function(m){return m.id===id;});}
function statusLabel(s){return{draft:'下書き',inprogress:'会議中',done:'完了'}[s]||'下書き';}
function statusColor(s){return{draft:'#94a3b8',inprogress:'#60a5fa',done:'#4ade80'}[s]||'#94a3b8';}
function statusBg(s){return{draft:'rgba(148,163,184,.15)',inprogress:'rgba(59,130,246,.15)',done:'rgba(22,163,74,.15)'}[s]||'rgba(148,163,184,.15)';}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;');}
function getPhotoSrc(p){return typeof p==='string'?p:(p.src||'');}

// ===== NEW MEETING STRUCTURE =====
// 議題ベース：agendas = [{id, text, decisions:[], actions:[], images:[]}]
function newMeeting(){
  return {id:Date.now(), title:'', date:new Date().toISOString().slice(0,16),
    location:'', attendees:'', agendas:[], notes:'', status:'draft'};
}
function newAgenda(){
  return {id:Date.now(), text:'', discussion:'', decisions:[], actions:[], images:[]};
}

// ===== FILTER =====
function setFilter(s){
  filterStatus = s;
  document.getElementById('searchInput').value = '';
  renderList();
}

// ===== LIST =====
function renderList(){
  var q = document.getElementById('searchInput').value.toLowerCase();
  var list = meetings.filter(function(m){
    if(filterStatus && m.status!==filterStatus) return false;
    if(q && !(m.title||'').toLowerCase().includes(q) && !(m.attendees||'').toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('listCount').textContent = list.length+'件';
  var el = document.getElementById('mList');
  if(!list.length){
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">議事録がありません<br>下の「＋ 新しい議事録を作成」から追加</div></div>';
    return;
  }
  el.innerHTML = '';
  list.forEach(function(m){
    var div = document.createElement('div');
    div.className = 'm-item';
    div.onclick = function(){openDetail(m.id);};
    var totalDec = 0, totalAct = 0, doneAct = 0, totalImg = 0;
    (m.agendas||[]).forEach(function(a){
      totalDec += (a.decisions||[]).length;
      totalAct += (a.actions||[]).length;
      doneAct  += (a.actions||[]).filter(function(x){return x.done;}).length;
      totalImg += (a.images||[]).length;
    });
    var tags = '';
    if((m.agendas||[]).length) tags += '<span class="m-tag" style="background:rgba(99,102,241,.15);color:var(--accent2);">議題 '+(m.agendas||[]).length+'</span>';
    if(totalDec) tags += '<span class="m-tag" style="background:rgba(22,163,74,.15);color:#4ade80;">決定 '+totalDec+'</span>';
    if(totalAct) tags += '<span class="m-tag" style="background:rgba(234,88,12,.15);color:#fb923c;">→ '+doneAct+'/'+totalAct+'</span>';
    if(totalImg) tags += '<span class="m-tag" style="background:rgba(8,145,178,.15);color:#22d3ee;">🖼 '+totalImg+'</span>';
    div.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
        '<div class="m-title'+(m.title?'':' empty')+'">'+(m.title||'（無題の会議）')+'</div>'+
        '<span class="status-badge" style="background:'+statusBg(m.status)+';color:'+statusColor(m.status)+';flex-shrink:0;">'+statusLabel(m.status)+'</span>'+
      '</div>'+
      '<div class="m-meta">'+(m.date?m.date.replace('T',' '):'日時未設定')+(m.location?' 📍'+m.location:'')+'</div>'+
      (tags?'<div class="m-tags">'+tags+'</div>':'');
    el.appendChild(div);
  });
}

// ===== ADD / OPEN / SAVE =====
function addMeeting(){
  var m = newMeeting();
  meetings.unshift(m);
  saveDB();
  openDetail(m.id);
}
function openDetail(id){
  currentId = id;
  var m = getM(id);
  document.getElementById('dTitle').value    = m.title    || '';
  document.getElementById('dDate').value     = m.date     || '';
  document.getElementById('dLocation').value = m.location || '';
  document.getElementById('dAttendees').value= m.attendees|| '';
  document.getElementById('dNotes').value    = m.notes    || '';
  renderAttendees();
  renderStatus();
  renderAgendaBlocks();
  showDetail();
  document.getElementById('detailBody').scrollTop = 0;
}
function save(){
  if(!currentId) return;
  var m = getM(currentId); if(!m) return;
  m.title     = document.getElementById('dTitle').value;
  m.date      = document.getElementById('dDate').value;
  m.location  = document.getElementById('dLocation').value;
  m.attendees = document.getElementById('dAttendees').value;
  m.notes     = document.getElementById('dNotes').value;
  saveDB();
}
function goBack(){save(); currentId=null; showScreen('home');}
function deleteCurrent(){
  if(!currentId) return;
  var m = getM(currentId);
  if(!confirm('「'+(m&&m.title||'この議事録')+'」を削除しますか？')) return;
  meetings = meetings.filter(function(x){return x.id!==currentId;});
  currentId = null; saveDB(); toast('削除しました','var(--danger)'); showScreen('home');
}

// ===== STATUS =====
function setStatus(s){
  if(!currentId) return;
  getM(currentId).status = s;
  renderStatus(); saveDB();
}
function renderStatus(){
  var m = getM(currentId); if(!m) return;
  var map = {draft:'stDraft', inprogress:'stInprogress', done:'stDone'};
  var cls = {draft:'active-draft', inprogress:'active-inprogress', done:'active-done'};
  Object.keys(map).forEach(function(k){
    var el = document.getElementById(map[k]);
    el.className = 'st-btn' + (m.status===k?' '+cls[k]:'');
  });
}

// ===== ATTENDEE TAGS =====
function renderAttendees(){
  var val  = document.getElementById('dAttendees').value;
  var wrap = document.getElementById('attendeeTagsWrap');
  wrap.innerHTML = '';
  if(!val) return;
  val.split(',').forEach(function(a){
    a = a.trim(); if(!a) return;
    var sp = document.createElement('span');
    sp.style.cssText = 'font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(99,102,241,.18);color:var(--accent2);';
    sp.textContent = a;
    wrap.appendChild(sp);
  });
}

// ===== AGENDA BLOCKS =====
function addAgenda(){
  if(!currentId) return;
  var m = getM(currentId);
  m.agendas.push(newAgenda());
  saveDB();
  renderAgendaBlocks();
  // 新しく追加したブロックへスクロール
  setTimeout(function(){
    var blocks = document.getElementById('agendaBlocks');
    blocks.lastElementChild && blocks.lastElementChild.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);
}
function removeAgenda(aid){
  if(!currentId) return;
  if(!confirm('この議題（決定事項・アクション・画像を含む）を削除しますか？')) return;
  var m = getM(currentId);
  m.agendas = m.agendas.filter(function(a){return a.id!==aid;});
  saveDB(); renderAgendaBlocks();
}
function getAgenda(m, aid){return (m.agendas||[]).find(function(a){return a.id===aid;});}

function renderAgendaBlocks(){
  var m   = getM(currentId); if(!m) return;
  var box = document.getElementById('agendaBlocks');
  box.innerHTML = '';
  if(!m.agendas.length){
    box.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">下の「＋ 議題を追加」で議題を作成</div>';
    return;
  }
  m.agendas.forEach(function(ag, idx){
    var block = document.createElement('div');
    block.className = 'agenda-block';
    block.id = 'ab-'+ag.id;

    // ── ヘッダー（議題入力）──
    var hdr = document.createElement('div');
    hdr.className = 'agenda-block-hdr';
    hdr.innerHTML =
      '<span class="agenda-num">'+String(idx+1).padStart(2,'0')+'</span>'+
      '<input class="agenda-input" placeholder="議題を入力…" value="'+escAttr(ag.text)+'">'+
      '<button class="agenda-del" onclick="removeAgenda('+ag.id+')">×</button>';
    hdr.querySelector('input').addEventListener('input', function(e){
      ag.text = e.target.value; saveDB();
    });
    block.appendChild(hdr);

    // ── 議論内容（自由記入）──
    var discSec = document.createElement('div');
    discSec.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;border-top:1px solid var(--border);';
    discSec.innerHTML = '<span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#60a5fa;">💬 議論内容</span>';
    block.appendChild(discSec);
    var discArea = document.createElement('textarea');
    discArea.className = 'fta';
    discArea.placeholder = '議論の内容、背景、補足情報などを自由に記入…';
    discArea.rows = 3;
    discArea.style.cssText = 'border-top:none;min-height:60px;font-size:12px;padding:8px 14px;';
    discArea.value = ag.discussion || '';
    discArea.addEventListener('input', function(){
      ag.discussion = discArea.value; saveDB();
    });
    block.appendChild(discArea);

    // ── 決定事項 ──
    var decSec = document.createElement('div');
    decSec.className = 'sub-sec';
    decSec.innerHTML =
      '<span class="sub-sec-label" style="color:#4ade80;">✓ 決定事項</span>'+
      '<button class="sub-sec-add" style="background:var(--green);" onclick="addDecision('+ag.id+')">+ 追加</button>';
    block.appendChild(decSec);
    var decList = document.createElement('div');
    decList.id = 'dec-'+ag.id;
    renderDecisions(ag, decList);
    block.appendChild(decList);

    // ── アクション ──
    var actSec = document.createElement('div');
    actSec.className = 'sub-sec';
    actSec.innerHTML =
      '<span class="sub-sec-label" style="color:#fb923c;">→ アクション</span>'+
      '<button class="sub-sec-add" style="background:var(--orange);" onclick="addAction('+ag.id+')">+ 追加</button>';
    block.appendChild(actSec);
    var actList = document.createElement('div');
    actList.id = 'act-'+ag.id;
    renderActions(ag, actList);
    block.appendChild(actList);

    // ── 画像 ──
    var imgSec = document.createElement('div');
    imgSec.className = 'sub-sec';
    imgSec.innerHTML =
      '<span class="sub-sec-label" style="color:#22d3ee;">🖼 画像</span>'+
      '<span style="display:flex;gap:4px;">'+
        '<button class="size-btn'+(imgSize==='sm'?' active':'')+'" onclick="setImgSize(\'sm\')">小</button>'+
        '<button class="size-btn'+(imgSize==='md'?' active':'')+'" onclick="setImgSize(\'md\')">中</button>'+
        '<button class="size-btn'+(imgSize==='lg'?' active':'')+'" onclick="setImgSize(\'lg\')">大</button>'+
      '</span>';
    block.appendChild(imgSec);

    var pasteZone = document.createElement('div');
    pasteZone.className = 'paste-zone';
    pasteZone.setAttribute('data-aid', ag.id);
    pasteZone.textContent = '📋 ドロップ / Ctrl+V で貼り付け';
    pasteZone.addEventListener('dragover', function(e){e.preventDefault();pasteZone.classList.add('over');});
    pasteZone.addEventListener('dragleave', function(){pasteZone.classList.remove('over');});
    pasteZone.addEventListener('drop', function(e){
      e.preventDefault(); pasteZone.classList.remove('over');
      var files = Array.from(e.dataTransfer.files).filter(function(f){return f.type.startsWith('image/');});
      if(files.length) handlePhotoFiles(files, ag.id);
    });
    block.appendChild(pasteZone);

    var imgGrid = document.createElement('div');
    imgGrid.id  = 'img-'+ag.id;
    imgGrid.className = 'img-grid '+imgSize;
    renderPhotos(ag, imgGrid);
    block.appendChild(imgGrid);

    // ── 下部：ライブラリ+カメラボタン ──
    var photoBtns = document.createElement('div');
    photoBtns.style.cssText = 'display:flex;gap:8px;padding:8px 14px 10px;';
    var lblLib = document.createElement('label');
    lblLib.style.cssText = 'flex:1;padding:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted);font-weight:700;';
    lblLib.innerHTML = '🖼 ライブラリ<input type="file" accept="image/*" multiple style="display:none;" onchange="handlePhotoFiles(this.files,'+ag.id+');this.value=\'\';">';
    var btnCam = document.createElement('button');
    btnCam.textContent = '📷 カメラ';
    btnCam.style.cssText = 'flex:1;padding:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);font-weight:700;cursor:pointer;font-family:\'Noto Sans JP\',sans-serif;';
    btnCam.onclick = function(){camTargetAgendaId = ag.id; openCam();};
    photoBtns.appendChild(lblLib);
    photoBtns.appendChild(btnCam);
    block.appendChild(photoBtns);

    box.appendChild(block);
  });
}

// ===== DECISIONS =====
function addDecision(aid){
  if(!currentId) return;
  var m  = getM(currentId);
  var ag = getAgenda(m, aid); if(!ag) return;
  ag.decisions.push({id:Date.now(), text:''});
  saveDB();
  var el = document.getElementById('dec-'+aid);
  if(el) renderDecisions(ag, el);
}
function renderDecisions(ag, el){
  el.innerHTML = '';
  if(!ag.decisions.length){
    el.innerHTML = '<div style="padding:8px 14px;font-size:12px;color:var(--muted);">決定事項なし</div>';
    return;
  }
  ag.decisions.forEach(function(item, i){
    var row = document.createElement('div');
    row.className = 'list-item';
    row.innerHTML =
      '<span class="list-num" style="color:#4ade80;">✓</span>'+
      '<input class="list-input" placeholder="決定事項 '+(i+1)+'" value="'+escAttr(item.text)+'">'+
      '<button class="item-del" onclick="removeDecision('+ag.id+','+item.id+')">×</button>';
    row.querySelector('input').addEventListener('input', function(e){
      item.text = e.target.value; saveDB();
    });
    el.appendChild(row);
  });
}
function removeDecision(aid, did){
  var m = getM(currentId); if(!m) return;
  var ag = getAgenda(m, aid); if(!ag) return;
  ag.decisions = ag.decisions.filter(function(x){return x.id!==did;});
  saveDB();
  var el = document.getElementById('dec-'+aid);
  if(el) renderDecisions(ag, el);
}

// ===== ACTIONS =====
function addAction(aid){
  if(!currentId) return;
  var m  = getM(currentId);
  var ag = getAgenda(m, aid); if(!ag) return;
  ag.actions.push({id:Date.now(), text:'', owner:'', due:'', done:false});
  saveDB();
  var el = document.getElementById('act-'+aid);
  if(el) renderActions(ag, el);
}
function renderActions(ag, el){
  el.innerHTML = '';
  if(!ag.actions.length){
    el.innerHTML = '<div style="padding:8px 14px;font-size:12px;color:var(--muted);">アクションなし</div>';
    return;
  }
  ag.actions.forEach(function(item){
    var div = document.createElement('div');
    div.className = 'action-item';
    div.innerHTML =
      '<div class="action-top">'+
        '<input type="checkbox" class="action-cb"'+(item.done?' checked':'')+'>'+
        '<input class="list-input" placeholder="タスク内容" value="'+escAttr(item.text)+'"'+
          (item.done?' style="text-decoration:line-through;color:var(--muted);"':'')+'>'+
        '<button class="item-del" onclick="removeAction('+ag.id+','+item.id+')">×</button>'+
      '</div>'+
      '<div class="action-sub">'+
        '<div><div class="sub-label">担当者</div><input class="sub-input" placeholder="山田太郎" value="'+escAttr(item.owner)+'"></div>'+
        '<div><div class="sub-label">期限</div><input type="date" class="sub-input" style="color-scheme:dark;" value="'+escAttr(item.due)+'"></div>'+
      '</div>';
    var cb = div.querySelector('.action-cb');
    cb.addEventListener('change', function(){
      item.done = cb.checked; saveDB();
      var aEl = document.getElementById('act-'+ag.id);
      if(aEl) renderActions(ag, aEl);
    });
    var ti = div.querySelector('.list-input');
    ti.addEventListener('input', function(){item.text = ti.value; saveDB();});
    var subs = div.querySelectorAll('.sub-input');
    subs[0].addEventListener('input',  function(){item.owner = subs[0].value; saveDB();});
    subs[1].addEventListener('change', function(){item.due   = subs[1].value; saveDB();});
    el.appendChild(div);
  });
}
function removeAction(aid, actId){
  var m = getM(currentId); if(!m) return;
  var ag = getAgenda(m, aid); if(!ag) return;
  ag.actions = ag.actions.filter(function(x){return x.id!==actId;});
  saveDB();
  var el = document.getElementById('act-'+aid);
  if(el) renderActions(ag, el);
}

// ===== PHOTOS =====
function compressImg(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w=img.width, h=img.height, ratio=Math.min(1280/w,1280/h,1);
      var c=document.createElement('canvas');
      c.width=Math.round(w*ratio); c.height=Math.round(h*ratio);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handlePhotoFiles(files, aid){
  if(!currentId) return;
  var m  = getM(currentId);
  var ag = getAgenda(m, aid||camTargetAgendaId); if(!ag) return;
  var arr = Array.from(files).filter(function(f){return f.type.startsWith('image/');});
  if(!arr.length) return;
  var loaded = 0;
  arr.forEach(function(file){
    compressImg(file, function(dataUrl){
      ag.images = ag.images||[];
      ag.images.push({src:dataUrl, comment:''});
      loaded++;
      // リアルタイム表示
      var grid = document.getElementById('img-'+ag.id);
      if(grid) renderPhotos(ag, grid);
      if(loaded===arr.length) saveDB(function(){toast('画像を追加しました');});
    });
  });
}
function renderPhotos(ag, grid){
  grid.innerHTML = '';
  grid.className = 'img-grid '+imgSize;
  (ag.images||[]).forEach(function(p, i){
    var wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    var delId = ag.id;
    wrap.innerHTML =
      '<img src="'+getPhotoSrc(p)+'">'+
      '<button class="img-del" onclick="removePhoto('+ag.id+','+i+')">✕</button>';
    grid.appendChild(wrap);
  });
}
function removePhoto(aid, idx){
  if(!confirm('この画像を削除しますか？')) return;
  var m = getM(currentId); if(!m) return;
  var ag = getAgenda(m, aid); if(!ag) return;
  ag.images.splice(idx, 1);
  saveDB();
  var grid = document.getElementById('img-'+aid);
  if(grid) renderPhotos(ag, grid);
}
function setImgSize(sz){
  imgSize = sz;
  // 全ブロックのグリッドを更新
  var m = getM(currentId); if(!m) return;

  document.getElementById('camModal').classList.remove('show');

function startCam(facing){
  if(camStream) camStream.getTracks().forEach(function(t){t.stop();});

    .then(function(stream){camStream=stream;document.getElementById('camVideo').srcObject=stream;})

function shootPhoto(){
  var video = document.getElementById('camVideo');
  var c = document.createElement('canvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  c.toBlob(function(blob){
    compressImg(new File([blob],'photo.jpg',{type:'image/jpeg'}), function(dataUrl){
      var m = getM(currentId); if(!m) return;
      var ag = getAgenda(m, camTargetAgendaId); if(!ag) return;

      saveDB(function(){toast('撮影しました');});

    });

}

function setAiMode(mode){

    document.getElementById('m'+m.charAt(0).toUpperCase()+m.slice(1)).classList.toggle('active', m===mode);
  });

  document.getElementById('aiRunBtn').textContent = labels[mode];
}
function runAI(){
  var m = getM(currentId); if(!m) return;
  var agText = (m.agendas||[]).map(function(a,i){
    return (i+1)+'. '+a.text+
      (a.decisions.length?'\n  決定: '+a.decisions.map(function(d){return d.text;}).join('、'):'');
  }).join('\n');
  var prompts = {
    summary: '以下の会議情報から議事録の要約を日本語で3〜5文で作成してください。\n\n会議名: '+m.title+'\n参加者: '+m.attendees+'\n議題:\n'+agText+'\nメモ: '+m.notes,

  };

function exportCsvOne(idx){
  var m = archive[idx]; if(!m) return;
  var bom='﻿';
  var rows=[['議題No.','議題','議論内容','決定事項','アクション','担当','期限','完了']];
  (m.agendas||[]).forEach(function(ag,ai){
    var disc = ag.discussion||'';
    var dec  = (ag.decisions||[]).map(function(d){return d.text;}).join(' / ');
    var acts = ag.actions||[];
    if(!acts.length){
      rows.push([ai+1, ag.text||'', disc, dec, '', '', '', '']);
    } else {
      acts.forEach(function(a, acti){
        rows.push([
          ai+1,
          acti===0 ? (ag.text||'') : '',
          acti===0 ? disc : '',
          acti===0 ? dec  : '',
          a.text||'', a.owner||'', a.due||'', a.done?'✓':''
        ]);
      });
    }
  });
  var csv = rows.map(function(r){
    return r.map(function(c){
      var v=String(c).replace(/"/g,'""');
      var hasComma=v.indexOf(',')>=0,hasNl=v.indexOf('\n')>=0,hasQ=v.indexOf('"')>=0;return(hasComma||hasNl||hasQ)?'"'+v+'"':v;
    }).join(',');
  }).join('\n');
  var fname = (m.title||'議事録').replace(/[\/:*?"<>|]/g,'_')+'.csv';
  var blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('CSVをダウンロードしました');
}

    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);

// ===== JSZip (inline) =====
var JSZip=(function(){
  function u16(v){return[(v)&0xff,(v>>8)&0xff];}
  function u32(v){return[(v)&0xff,(v>>8)&0xff,(v>>16)&0xff,(v>>24)&0xff];}
  function sB(s){var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;return a;}
  function cat(arrays){var n=0;for(var i=0;i<arrays.length;i++)n+=arrays[i].length;var o=new Uint8Array(n),p=0;for(var i=0;i<arrays.length;i++){o.set(arrays[i],p);p+=arrays[i].length;}return o;}
  var CT=(function(){var t=new Uint32Array(256);for(var i=0;i<256;i++){var c=i;for(var j=0;j<8;j++)c=c&1?(0xedb88320^(c>>>1)):(c>>>1);t[i]=c;}return t;})();
  function crc32(b){var c=0xffffffff;for(var i=0;i<b.length;i++)c=CT[(c^b[i])&0xff]^(c>>>8);return(c^0xffffffff)>>>0;}
  function Zip(){this._files=[];}
  Zip.prototype.file=function(name,data,opts){
    if(opts&&opts.base64){var s=atob(data.replace(/[^A-Za-z0-9+/=]/g,''));var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);data=a;}
    else if(typeof data==='string')data=sB(data);
    this._files.push({name:sB(name),data:data});return this;
  };
  Zip.prototype.generateAsync=function(opts){
    var files=this._files;
    return new Promise(function(resolve){
      var locals=[],offsets=[],pos=0;
      files.forEach(function(f){
        var crc=crc32(f.data),sz=f.data.length;
        var lh=new Uint8Array([0x50,0x4b,0x03,0x04,20,0,0,0,0,0,0,0,0,0].concat(u32(crc)).concat(u32(sz)).concat(u32(sz)).concat(u16(f.name.length)).concat(u16(0)));
        var entry=cat([lh,f.name,f.data]);offsets.push(pos);locals.push(entry);pos+=entry.length;
      });
      var cds=[],cdStart=pos;
      files.forEach(function(f,i){
        var crc=crc32(f.data),sz=f.data.length;
        var cd=new Uint8Array([0x50,0x4b,0x01,0x02,20,0,20,0,0,0,0,0,0,0,0,0].concat(u32(crc)).concat(u32(sz)).concat(u32(sz)).concat(u16(f.name.length)).concat(u16(0)).concat(u16(0)).concat(u16(0)).concat(u16(0)).concat(u32(0)).concat(u32(offsets[i])));
        cds.push(cat([cd,f.name]));
      });
      var cdSize=0;for(var i=0;i<cds.length;i++)cdSize+=cds[i].length;
      var eocd=new Uint8Array([0x50,0x4b,0x05,0x06,0,0,0,0].concat(u16(files.length)).concat(u16(files.length)).concat(u32(cdSize)).concat(u32(cdStart)).concat(u16(0)));
      resolve(new Blob([cat(locals.concat(cds).concat([eocd]))],{type:(opts&&opts.mimeType)||'application/zip'}));
    });
  };
  return Zip;
})();
